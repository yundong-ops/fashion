          fill="#4a6fa5" stroke="#33507e" stroke-width="3"/>
    <!-- 팔 -->
    <path d="M -70 70 L -95 190 L -80 195 L -55 90 Z" fill="#9db8d8" stroke="#7391b8" stroke-width="2"/>
    <path d="M 70 70 L 95 190 L 80 195 L 55 90 Z" fill="#9db8d8" stroke="#7391b8" stroke-width="2"/>
  </g>

  <text x="192" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#71717a">
    미리보기 이미지 (mock 프로바이더)
