<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <rect width="384" height="512" fill="url(#bg)"/>

  <!-- 인물 실루엣 -->
